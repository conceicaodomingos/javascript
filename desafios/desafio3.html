<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antes e depois</title>
    <style>
        body {
            font: normal 12pt Arial;
        }
        button {
            font: normal 12pt arial;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Antes e depois</h1>
    <button onclick="calcular()">Antecessor e Sucessor</button>

    <script>
        function calcular() {
            let n = Number(window.prompt("Digite um número inteiro qualquer: "))

            window.alert(`Antes de ${n}, temos o número ${n-1}.\nDepois de ${n}, temos o número ${n+1}.`)
        }
    </script>
</body>
</html>
