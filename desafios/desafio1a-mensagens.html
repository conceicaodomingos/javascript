<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens</title>
    <style>
        body {
            font: normal 12pt Arial;
        }
        button {
            font: normal 12pt arial;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Desafio das Mensagens</h1>
    <p>Clique em cada botão para ver a interação.</p>
    <button onclick="clicar1()">Botão 1</button>
    <button onclick="clicar2()">Botão 2</button>
    <button onclick="clicar3()">Botão 3</button>

    <script>
        function clicar1() {
            window.alert("Você clicou no 1º botão!")
        }
        function clicar2() {
            window.alert("Você clicou no 2º botão!")
        }
        function clicar3() {
            window.alert("Você clicou no 3º botão!")
        }
    </script>
</body>
</html>
