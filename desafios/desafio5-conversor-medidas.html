<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Medidas</title>
    <style>
        body {
            font: normal 16px Arial;
        }
        button {
            font: normal 16px arial;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Conversor de Medidas</h1>
    <button onclick="converter()">Converter</button>
    <p>Clique no botão acima para iniciar</p>
    <div id="r"></div>

    <script>
        function converter() {
            d = Number(window.prompt("Digite uma distância em metros (m)"))
            r = window.document.getElementById("r")

            r.innerHTML = `<h2>A distância de ${d} metros, corresponde a...</h2>\n`
            r.innerHTML += `<p>${d/1000} quilometros (km)</p>`
            r.innerHTML += `<p>${d/100} hectometros (hm)</p>`
            r.innerHTML += `<p>${d/10} decametros (dam)</p>`
            r.innerHTML += `<p>${d*10} decimetros (dm)</p>`
            r.innerHTML += `<p>${d*100} centimetros (cm)</p>`
            r.innerHTML += `<p>${d*1000} milimetros (mm)</p>`
        }
    </script>
</body>
</html>
