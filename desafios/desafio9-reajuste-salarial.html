<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reajuste Salarial</title>
    <style>
        body {
            font: normal 16px Arial;
        }
        button {
            font: normal 16px arial;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Reajuste Salarial</h1>
    <button onclick="reajustar()">Reajustar Salário</button>
    <div id="r"></div>
    <script>
        function reajustar() {
            nome = (window.prompt("Qual é o nome do funcionário?"))
            salario = Number(window.prompt(`Qual é o salário de ${nome}?`))
            reajuste = Number(window.prompt(`O salário de ${nome} vai ser reajustado em qual percentagem?`))

            r.innerHTML = `<h2>${nome} recebeu um aumento salarial!</h2>`
            r.innerHTML += `<p>O salário atual era Akz ${salario}.</p>` 
            r.innerHTML += `<p>Com um aumento de 18%, o salário vai aumentar Akz ${salario * reajuste * .01} no próximo mês.</p>`
            r.innerHTML += `<p>E a partir daí, ${nome} vai passar a ganhar Akz ${salario * (1 + reajuste * .01)}</p>`
        }
    </script>
</body>
</html>
