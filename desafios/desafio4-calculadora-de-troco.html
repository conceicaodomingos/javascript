<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcula Troco</title>
    <style>
        body {
            font: normal 12pt Arial;
        }
        button {
            font: normal 12pt arial;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Calculando o troco</h1>
    <button onclick="calcular()">Comprar produto</button>

    <script>
        function calcular() {
            let produto = window.prompt("Que produto você está comprando?")
            let preco = Number(window.prompt(`Quanto custa ${produto} que você está comprando?`))
            let valor_pago = Number(window.prompt(`Qual foi o valor que você deu para pagar ${produto}?`))

            window.alert(`Você comprou ${produto} que custou AOA ${preco}\nDeu AOA ${valor_pago} em dinheiro e vai receber AOA ${valor_pago - preco} de troco.\nVolte sempre!`)
        } 
    </script>
</body>
</html>
