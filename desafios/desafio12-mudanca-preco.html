<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudança Preço</title>
    <style>
        body {
            font: normal 16px Arial;
        }
        button {
            font: normal 16px arial;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Mudança de Preço</h1>
    <button onclick="verificar()">Verificar</button>
    <div id="r"><p>Clique no botão acima para analisar a mudança de preço.</p></div>

    <script>
        function verificar() {
            precoAnterior = Number(window.prompt("Qual era o preço anterior do produto?"))
            precoActual = Number(window.prompt("Qual é o preço actual do produto?"))

            r.innerHTML = "<h2>Analisando os valores informados</h2>"
            r.innerHTML += `<p>O produto custava Akz ${precoAnterior} e agora custa Akz ${precoActual}.</p>`

            if (precoAnterior < precoActual) {
                r.innerHTML += "<p>Hoje o produto está mais caro.</p>"
                r.innerHTML += `<p>O preço subiu Akz ${precoActual - precoAnterior} em relação ao preço anterior.</p>`
                r.innerHTML += `<p>Uma variação de ${((precoActual - precoAnterior) / precoActual)*100}% para cima.</p>`
            } else {
                r.innerHTML += "<p>Hoje o produto está mais barato.</p>"
                r.innerHTML += `<p>O preço caiu Akz ${precoAnterior - precoActual} em relação ao preço anterior.</p>`
                r.innerHTML += `<p>Uma variação de ${((precoAnterior - precoActual) / precoActual)*100}% para baixo.</p>`
            }
        }
    </script>
</body>
</html>
