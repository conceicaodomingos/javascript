<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par ou Ímpar</title>
    <style>
        body { 
            font: 16px Arial; 
        }
        button { 
            font-size: 16px; 
            padding: 30px; 
        }
        h1 { 
            font-family: 'Pacifico', cursive; font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>É par ou ímpar?</h1>
    <button onclick="parImpar()">Clique para iniciar</button>
    <section id="resultado">
        <p>O resultado vai aparecer aqui...</p>
    </section>

    <script>
        let resultado = window.document.getElementById("resultado")
        let tipo

        function parImpar() {
            let numero = Number(window.prompt("Digite um número: "))
            if (numero % 2 == 0) {
                tipo = '<strong>PAR</strong>'
            } else {
                tipo = '<strong>ÍMPAR</strong>' 
            }
            resultado.innerHTML = `<p>O número ${numero} que foi digitado é ${tipo}</p>`
        }
    </script>
</body>
</html>
