<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interação JS</title>
    <style>
        body { 
            font: 16px Arial; 
        }
        button { 
            font-size: 16px; 
            padding: 30px; 
        }
    </style>
</head>
<body>
    <h1>Interagindo com um botão</h1>
    <button onclick="clicar()">Clique em mim!</button>
    <script>
        function clicar() {
            window.alert("Você clicou no botão!")
        }
    </script>
</body>
</html>
