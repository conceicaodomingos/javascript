<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Cliques</title>
    <style>
        body { 
            font: 16px Arial; 
        }
        button { 
            font-size: 16px; 
            padding: 30px; 
        }
        h1 { 
            font-family: 'Pacifico', cursive; font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Contador de Cliques</h1>
    <button onclick="contar()">Clique em mim</button>
    <button onclick="zerar()">Zerar o contador</button>
    <section id="r">
        <p>O contador está com <mark>0</mark> cliques.</p>
    </section>
    <script>
        let c = 0
        let r = window.document.getElementById('r')
        function contar() {
            c++
            r.innerHTML =`<p>O contador está com <mark>${c}</mark> cliques.</p>` 
        }
        function zerar() {
            c = 0
            r.innerHTML = `<p>O contador foi zerado!</p>`
        }
    </script>
</body>
</html>
