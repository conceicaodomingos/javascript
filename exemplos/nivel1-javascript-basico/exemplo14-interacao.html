<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interagindo com o Sistema</title>
    <style>
        body { 
            font: 16px Arial; 
        }
        button { 
            font-size: 16px; 
            padding: 30px; 
        }
        h1 { 
            font-family: 'Pacifico', cursive; font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Interagindo com o sistema</h1>
    <button onclick="interagir()">Clique em mim</button>
    <section id="saida">
        <p>Aqui vai aparecer algo...</p>
    </section>
    <script>
        function interagir() {
            let agora = new Date
            let saida = window.document.getElementById("saida")
            saida.innerHTML = `O que eu recebi do sistema foi <mark>${agora}</mark>`
        }
    </script>
</body>
</html>
