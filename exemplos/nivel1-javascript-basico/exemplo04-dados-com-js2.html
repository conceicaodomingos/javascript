<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados com JS-2</title>
    <style>
        body { 
            font: 16px Arial; 
        }
        button { 
            font-size: 16px; 
            padding: 30px; 
        }
    </style>
</head>
<body>
    <h1>Trabalhando com Dados - Versão 2</h1>
    <button onclick="comecar()">Clique para começar</button>
    <div id="res"><p>Aqui vai aparecer o resultado...</p></div>
    <script>
        function comecar() {
            let nome = window.prompt("Qual é o seu nome?")
            let res = window.document.getElementById('res')
            res.innerHTML = `<p>Olá <strong>${nome}!</strong> É um grande prazer te conhecer. &#x1F596;</p>`
        }
    </script>
</body>
</html>
