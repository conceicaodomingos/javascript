<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisando Data e Hora</title>
    <style>
        body { 
            font: 16px Arial; 
        }
        button { 
            font-size: 16px; 
            padding: 30px; 
        }
        h1 { 
            font-family: 'Pacifico', cursive; font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Analisando Data e Hora</h1>
    <button onclick="analisar()">Iniciar Análise</button>
    <section id="saida">
        <p>Aqui vai aparecer algo...</p>
    </section>

    <script>
        let meses = new Array("Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro")
        let semana = new Array("Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado")
        let agora = new Date

        let saida = window.document.getElementById("saida")

        let dia = agora.getDate()
        let mes = agora.getMonth()
        let ano = agora.getFullYear()
        let diaSemana = agora.getDay()
        let hora = agora.getHours()
        let minutos = agora.getMinutes()
        let segundos = agora.getSeconds()

        function analisar() {
            saida.innerHTML = `<p>Dia: <mark>${dia}</mark></p>`
            saida.innerHTML += `<p>Mês: <mark>${meses[mes]}</mark></p>`
            saida.innerHTML += `<p>Ano: <mark>${ano}</mark></p>`
            saida.innerHTML += `<p>Dia da semana: <mark>${semana[diaSemana]}</mark></p>`
            saida.innerHTML += `<p>Hora: <mark>${hora}</mark></p>`
            saida.innerHTML += `<p>Minutos: <mark>${minutos}</mark></p>`
            saida.innerHTML += `<p>Segundos: <mark>${segundos}</mark></p>`
        }
    </script>
</body>
</html>
